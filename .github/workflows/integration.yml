name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Migration and API integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://portfolio_ci:portfolio_ci@postgres-ci:5432/portfolio_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI environment files
        run: |
          cp backend/.env.local.example backend/.env.local

      - name: Start disposable PostgreSQL
        run: docker compose --env-file backend/.env.local --profile ci up -d --wait postgres-ci

      - name: Run GORM migration
        run: make migrate MIGRATION_DB_SERVICE=postgres-ci

      - name: Start backend
        run: docker compose --env-file backend/.env.local up -d backend

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8081/api/app-mode >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file backend/.env.local logs backend
          exit 1

      - name: Check public health endpoint
        run: curl --fail http://localhost:8081/health

      - name: Reject unauthenticated admin request
        shell: bash
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/api/auth/me)
          test "$status" = "401"

      - name: Accept valid Basic authentication
        run: curl --fail --user admin:change-me http://localhost:8081/api/auth/me

      - name: Stop integration services
        if: always()
        run: docker compose --env-file backend/.env.local down -v
